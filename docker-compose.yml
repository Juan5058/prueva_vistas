services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - trd

  app:
    build:
      context: ./docker/php
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: mongodb
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: trd_documental
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/vendor/autoload.php"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    networks:
      - trd

  queue:
    build:
      context: ./docker/php
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=120
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    environment:
      WAIT_FOR_VENDOR: "1"
      DB_CONNECTION: mongodb
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: trd_documental
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_healthy
    networks:
      - trd

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - trd

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - trd

volumes:
  mongo_data:
  vendor_data:

networks:
  trd:
    driver: bridge
